name: Deploy DoctorTracer Web to GitHub Pages

# The main branch is intentionally older than the most recent published Web
# release. Deploy from the verified release tag, not main's legacy web/.
# Update the release ref when a newer Web release is approved.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doctortracer-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out verified DoctorTracer 0.16.0 Web release
        uses: actions/checkout@v4
        with:
          ref: v0.16.0-wasm-preview

      - name: Check release files and JavaScript syntax
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/app.js
          test -s web/worker.js
          test -s web/rust-tracer.mjs
          test -s web/doctortracer.wasm
          test -s web/tracer.wasm
          node --check web/app.js
          node --check web/worker.js
          node --check web/rust-tracer.mjs

      - name: Test shipped WebAssembly runtimes and palette
        run: |
          node tests/wasm.mjs
          node tests/rust_wasm.mjs
          node tests/palette_ui.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Web 0.16.0 release
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

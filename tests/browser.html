<!doctype html><html lang="en"><meta charset="utf-8"><title>DoctorTracer browser verification</title><h1>Rust WASM / WebGPU verification</h1><pre id="result">Running…</pre><script type="module">
import createTracer from '../web/rust-tracer.mjs';import {gpuFilter,gpuStage,gpuPrepare,gpuAssign} from '../web/gpu.js';import {pdfBytes} from '../web/exports.mjs';
const result=document.querySelector('#result');const check=(ok,msg)=>{if(!ok)throw Error(msg);};
try{
 const runtime=await createTracer();let tests=0,gpuCases=0,modesCases=0,spatialCases=0;
 for(const [w,h] of [[1,1],[19,17],[64,48],[129,73]])for(const detail of [0,1,2]){
  result.textContent='Checking GPU '+w+'×'+h+' / '+detail;
  const p=new Uint8Array(w*h*4);for(let i=0;i<p.length;i++)p[i]=(i*7919+(i>>4)*37)%256;
  const cpu=runtime.filter(p,w,h,detail);const gpu=await gpuFilter(p,w,h,detail);
  if(gpu){check(cpu.length===gpu.length&&cpu.every((v,i)=>v===gpu[i]),'GPU differs from CPU '+w+'x'+h+' detail '+detail);gpuCases++;}
  const mode=runtime.stage(cpu,w,h,{kind:1,detail});const gpuMode=await gpuStage(cpu,w,h,detail,'modes');if(gpuMode){modesCases++;check(mode.every((v,i)=>v===gpuMode[i]),'GPU modes differ');}const prepared=await gpuPrepare(p,w,h,{category:'photo',colors:0,detail});const values=runtime.stage(mode,w,h,{kind:2,colors:64,extra:1}),palette=Array.from({length:values.length/3},(_,i)=>Array.from(values.slice(3*i,3*i+3)));for(const strength of [0,200,700]){const labels=runtime.stage(mode,w,h,{kind:3,palette,extra:strength}),accelerated=await gpuAssign(mode,w,h,palette,strength);if(accelerated){spatialCases++;check(labels.every((v,i)=>v===accelerated[i]),'GPU spatial assignment differs '+strength);}if(accelerated&&strength===200)check(runtime.finish(mode,accelerated,w,h,{palette,detail,speckle:0})===runtime.trace(mode,w,h,{colors:0,detail,speckle:0,prefiltered:true}),'GPU finish differs');if(accelerated&&strength===700)check(runtime.finish(mode,accelerated,w,h,{palette,detail,speckle:0,unlimited:false})===runtime.trace(mode,w,h,{colors:0,palette,detail,speckle:0,prefiltered:true}),'GPU fixed shared finish differs');}if(prepared)check(runtime.trace(p,w,h,{colors:0,detail,speckle:0})===runtime.trace(prepared,w,h,{colors:0,detail,speckle:0,prefiltered:true}),'GPU full photo differs');
  const a=runtime.trace(p,w,h,{colors:4,detail,speckle:0});
  const b=runtime.trace(cpu,w,h,{colors:4,detail,speckle:0,prefiltered:true});check(a===b,'CPU prefilter differs');
  if(gpu)check(a===runtime.trace(gpu,w,h,{colors:4,detail,speckle:0,prefiltered:true}),'GPU trace differs');tests++;
 }
 const w=64,h=48,p=new Uint8Array(w*h*4);for(let y=2;y<46;y++)for(let x=2;x<62;x++)p.set(x<32?[210,30,80,255]:[20,160,210,255],4*(y*w+x));p.fill(0,4*(12*w+12),4*(12*w+12)+4);
 const svg=runtime.trace(p,w,h,{colors:2,detail:2,speckle:0,category:'hard'});
 const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.src=url;await img.decode();const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const a=ctx.getImageData(0,0,w,h).data;check(a[4*(12*w+12)+3]===0,'one-pixel alpha hole lost');check(a[4*(10*w+10)+3]===255,'visible region lost');URL.revokeObjectURL(url);
 const pdf=pdfBytes(svg);check(new TextDecoder().decode(pdf).includes('/S /Transparency'),'PDF groups missing');
 const layouts=[];const desktopLayout=await(await fetch('../web/desktop-layout.json')).json();
 const wait=async predicate=>{const deadline=performance.now()+30000;while(!predicate()){if(performance.now()>deadline)throw Error('UI timeout');await new Promise(r=>setTimeout(r,25));}};
 for(const [width,height] of [[390,844],[640,640],[820,640],[1280,720]]){
  result.textContent='Checking wizard '+width+'×'+height;
  const frame=document.createElement('iframe');frame.style.cssText='position:absolute;left:-10000px;top:0;border:0;width:'+width+'px;height:'+height+'px';frame.src='../web/';document.body.append(frame);await new Promise(r=>frame.onload=r);const d=frame.contentDocument;
  const click=title=>{const b=[...d.querySelectorAll('.card')].find(b=>b.querySelector('strong').textContent===title);check(!!b,'Missing card '+title);b.click();};
  const layout=()=>{if(width>=820){for(const [actual,expected,name]of[[d.querySelector('aside').getBoundingClientRect().width,desktopLayout.sidebar_width,'sidebar'],[d.querySelector('.paneltitle').getBoundingClientRect().height,desktopLayout.header_height,'header'],[d.querySelector('#next').getBoundingClientRect().height,desktopLayout.nav_height,'navigation']])check(Math.abs(actual-expected)<=1,'Desktop layout mismatch '+name+' '+actual);for(const card of d.querySelectorAll('.card'))check(Math.abs(card.getBoundingClientRect().width-desktopLayout.card_width)<=1&&Math.abs(card.getBoundingClientRect().height-desktopLayout.card_height)<=1,'Desktop card dimensions');}check(d.documentElement.scrollWidth<=width+1,'Horizontal page overflow '+width);const aside=d.querySelector('aside').getBoundingClientRect();for(const e of d.querySelectorAll('aside button,aside input,aside select')){const r=e.getBoundingClientRect();if(!r.width&&!r.height)continue;check(r.left>=aside.left-1&&r.right<=aside.right+1,'Sidebar overflow '+width+' '+e.textContent);} };
  layout();d.querySelector('#demo').click();await wait(()=>Array.from(d.querySelectorAll('.card strong')).some(s=>s.textContent==='Базовый'));click('Базовый');layout();click('Смешанные Края');layout();click('Среднее Качество');layout();click('Настраиваемые Цвета');await wait(()=>d.querySelector('#editablePalette input'));layout();d.querySelector('#colors').value='9';d.querySelector('#gpu').checked=false;d.querySelector('#next').click();await wait(()=>!d.querySelector('#vector').disabled);layout();click('Рецензия Сделанного');layout();for(const b of d.querySelectorAll('.export-toggle'))b.click();layout();check(d.querySelector('#format').options.length===3,'Export formats');layouts.push({width,height,ok:true});frame.remove();
 }
 result.textContent=JSON.stringify({ok:true,cases:tests,gpuCases,modesCases,spatialCases,onePixelHole:true,pdfGroups:true,wasm:true,layouts},null,2);
}catch(error){result.textContent=JSON.stringify({ok:false,error:String(error),stack:error.stack},null,2);}
</script></html>

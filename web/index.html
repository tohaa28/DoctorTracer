<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoctorTracer • WASM</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>DoctorTracer</strong><span>WASM • локальная обработка</span><label class="open">Открыть изображение<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label></header>
<main><section class="workspace"><div class="viewbar"><button id="bitmap" aria-pressed="true">Bitmap (B)</button><button id="vector" aria-pressed="false" disabled>Вектор (V)</button><label><input id="outlines" type="checkbox">Контуры</label><label>Масштаб <input id="zoom" type="range" min="20" max="300" value="100"></label></div><div id="viewport"><div id="empty">Откройте PNG, JPEG, WebP или BMP<br><small>Изображение остаётся на вашем компьютере</small></div><img id="preview" alt="Предпросмотр" hidden></div></section>
<aside><h1 id="stepTitle">Режим Мастера</h1><div id="page"></div><nav><button id="home">◀ В начало</button><button id="back">◀ Назад</button><button id="next">Вперёд ▶</button></nav></aside></main>
<footer><span id="status">Готово • WASM preview</span><span>Цветная сегментация + Potrace 1.16</span></footer><script type="module" src="app.js"></script></body></html>

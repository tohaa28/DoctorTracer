<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoctorTracer — качество трассировки</title>
<style>body{font:15px system-ui;margin:24px;background:#f2f4f6;color:#18232e}h1{font-size:26px}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:8px}article{background:white;padding:16px;margin:18px 0;border:1px solid #ccd5de;border-radius:8px}h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}figure{margin:0;min-height:130px}img{width:100%;height:250px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 0/16px 16px;image-rendering:auto}figcaption{padding:8px;text-align:center}input{padding:9px;width:300px;max-width:90%}label{margin:12px;display:inline-block}article[hidden]{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.wipe{position:relative;max-width:1000px;margin:12px auto}.wipe img{display:block;height:auto}.wipe .over{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.slider{display:block;width:90%;margin:auto}.dashboard{padding:18px;background:white;border:1px solid #ccd5de;border-radius:8px}.dashboard table{width:100%;border-collapse:collapse}.dashboard th,.dashboard td{text-align:left;padding:10px;border-bottom:1px solid #ddd}select{padding:8px}article[data-regression=true]{border:2px solid #b92c3b}</style>
<h1>Сравнение трассировок</h1><p>Одинаковый исходник и записанные настройки. Отсутствующие или неподтверждённые эталоны исключены из оценки. Нажмите изображение для просмотра в полном размере.</p>
<!--DASHBOARD-->
<details><summary>Полные данные покрытия и результата</summary><pre><!--SUMMARY--></pre></details>
<label>Поиск <input id="search" placeholder="Имя, тип, профиль, holdout"></label><label><input type="checkbox" id="only" style="width:auto"> Только с подтверждённым эталоном</label>
<label><input type="checkbox" id="regressions" style="width:auto"> Только ухудшения</label>
<label>Назначение <select id="domain"><option value="all">Все случаи</option><option value="recommended">Соответствующий тип входа</option><option value="stress">Стресс: другой тип входа</option></select></label>
<!--CASES-->
<script>function filter(){const domain=document.querySelector('#domain').value,q=document.querySelector('#search').value.toLowerCase(),only=document.querySelector('#only').checked,reg=document.querySelector('#regressions').checked;for(const a of document.querySelectorAll('article'))a.hidden=(domain!=='all'&&a.dataset.domain!==domain)||!a.textContent.toLowerCase().includes(q)||(only&&!a.textContent.includes(' · verified · '))||(reg&&a.dataset.regression!=='true');}document.querySelector('#domain').onchange=filter;document.querySelector('#search').oninput=filter;document.querySelector('#only').onchange=filter;document.querySelector('#regressions').onchange=filter;for(const s of document.querySelectorAll(".slider"))s.oninput=()=>s.previousElementSibling.querySelector(".over").style.clipPath="inset(0 "+(100-s.value)+"% 0 0)";</script></html>
